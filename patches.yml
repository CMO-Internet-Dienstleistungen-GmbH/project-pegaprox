# Which upstream release we track, and which of our fixes ride on top of it.
#
# This file is the only thing that changes when a fix lands upstream or a new
# one is added — the scripts read it, nothing is hardcoded there.

upstream:
  # GitHub repo we track. Releases (not arbitrary tags) drive the sync.
  repo: PegaProx/project-pegaprox
  url: https://github.com/PegaProx/project-pegaprox.git

fork:
  # Remote name inside the clone the scripts run in.
  remote: origin
  # Rebuilt from the upstream release tag on every sync — never merged into,
  # so it is force-pushed by design. The tags below are the stable references.
  integration_branch: cmo/main
  # Tag scheme: <upstream tag>-<suffix>.<n>, e.g. v1.0.2-cmo.1
  tag_suffix: cmo

# Our patches, applied in this order on top of the upstream release tag.
#
#   branch       a branch in the fork holding the commits
#   base         the upstream branch the work was offered to. The commits taken
#                are `merge-base(<release tag>, branch)..branch` -- measured
#                against the release being built, because an upstream branch
#                moves under us and a tag does not. `base` is what the run
#                compares against to tell this patch's commits from upstream's
#                own; commits the branch reaches that upstream/<base> already
#                has stop the run instead of being squashed in under our name.
#   upstream_pr  the pull request upstream; when it is merged, the patch is
#                dropped from the set instead of applied (the fix is in the
#                release by then). Leave empty if there is no PR yet.
#   kind         fix | feature | internal, default fix.
#                `fix` and `feature` are meant to end up upstream and disappear
#                from this file on their own -- the sync drops them once the
#                release contains the work (patch-id) or the PR is merged.
#                `internal` is the opposite promise: it stays in the fork for
#                good, so neither heuristic is allowed to touch it and an empty
#                commit set is an error rather than a silent skip.
#                An unknown value stops the run: a typo must not quietly turn a
#                permanent patch back into a droppable one.
#   requested_by an issue number in **this** fork, and required for every patch.
#                That issue is the patch's scope: what it does, what it
#                deliberately does not do, and acceptance criteria that can be
#                checked. It is what a conflict is resolved against -- without
#                it, whoever carries the patch across a moved codebase is
#                guessing at what to preserve. Closed is fine; the work being
#                done does not make the scope less true.
#   commit_message the stable squash subject used on cmo/main. It must follow
#                `<type>(<area>): <what changed>` and describe the patch as a
#                whole. Rebuilds must not derive it from branch commit order.
#                Change it only when the patch scope changed or the existing
#                subject is materially wrong, and explain why in the
#                cmo/automation commit body.
patches:
  # Upstream issue #743 is open; PR #745 was closed pending discussion, so there
  # is no PR to track and the entry has to be retired by hand once upstream
  # ships its own System theme.
  - name: system-theme
    branch: feat/system-theme
    base: main
    kind: feature
    upstream_pr:
    summary: '"System" theme follows the OS light/dark setting (upstream issue #743)'
    commit_message: 'feat(theme): follow the OS light/dark setting'
    requested_by: 6

  # The chooser GitHub shows when someone opens an issue here. Upstream's asks
  # for sponsors and stars; ours asks the two questions the triage needs
  # answered. It is `internal` on purpose -- there is no version of this that
  # upstream would want, so the sync must never decide it has been absorbed.
  - name: issue-templates
    branch: chore/issue-templates
    base: main
    kind: internal
    upstream_pr:
    summary: German issue forms that ask what this fork needs, not what upstream needs
    commit_message: 'chore(issue-templates): ask what this fork needs from requesters'
    requested_by: 8

  # One idle tab produced ~4 REST calls/s: authFetch was rebuilt on every render,
  # so the seven ui.js components that depend on it had their polling effects
  # re-armed by every SSE frame; and the guest-info cache treated a "no address"
  # answer as a cache miss, which closed into a self-feeding loop.
  # Upstream issue #782 landed in v1.1.1 (commit 0f6d17a), but only the
  # authFetch/getAuthHeaders memoisation half -- the guest-info concurrency
  # limit and ipCache fix in web/src/tables.js has no upstream counterpart yet,
  # so this patch stays. No PR yet, so `upstream_pr` stays empty.
  - name: ui-request-amplification
    branch: fix/ui-request-amplification
    base: main
    kind: fix
    upstream_pr:
    summary: 'The UI stops re-arming its polling effects on every render, and the guest-info fan-out stops feeding itself'
    commit_message: 'fix(web): stop the UI amplifying its own requests'
    requested_by: 10

  # The health rollup is a cluster-wide number, but every tab used to compute its
  # own -- get_node_status() plus one uncached storage call per online node, per
  # request. Now it is computed once per watched cluster and pushed over the SSE
  # channel that already carries resources/metrics/tasks. Ordered after
  # ui-request-amplification: both touch the guest-info filter in web/src/tables.js,
  # and the resolution keeps BOTH guards (`!r.ip` plus that patch's cache probe).
  - name: cluster-state-broadcast
    branch: feat/cluster-state-broadcast
    base: main
    kind: feature
    upstream_pr:
    summary: 'Cluster health is computed once per cluster and broadcast, instead of polled by every tab'
    commit_message: 'feat(health): broadcast one shared cluster health rollup'
    requested_by: 11

  # Snapshot mutations in the Corporate VM detail discarded the JSON error
  # returned by the server. Keep the existing generic text only as a fallback
  # when the response is missing or cannot be parsed.
  # Taken upstream into `Testing` as our own commit, but v1.1.1 predates that,
  # so the fix is not in the release we build on and the patch still has to be
  # applied. The branch is rebased onto the release tag, which is what makes
  # its commit set this patch alone; `base` stays the branch it was offered to.
  - name: snapshot-error-toasts
    branch: fix/snapshot-error-toasts
    base: main
    kind: fix
    upstream_pr:
    summary: 'Snapshot action toasts show the error returned by the server'
    commit_message: 'fix(web): surface snapshot API errors in toasts'
    requested_by: 13

  # The Corporate QEMU summary already fetches the VM config for hardware
  # details. Reuse that response to show a non-empty description as escaped,
  # multiline text without changing the Config editor or Markdown preview.
  - name: vm-description-summary
    branch: feat/vm-description-summary
    base: main
    kind: feature
    upstream_pr:
    summary: 'Corporate QEMU summaries show the VM description as safe multiline text'
    commit_message: 'feat(web): show VM descriptions in Corporate summary'
    requested_by: 14

  # Hyper-V as a restricted migration source, per the epic in issue #15. All of
  # its phases -- connection, inventory, preflight, offline import, console --
  # belong to this one branch and this one entry; the sub-issues do not get
  # branches of their own. Additive by construction: a HyperVManager and its own
  # UI files, with one-line hooks where an upstream file has to know they exist.
  # `feature`, because it is meant to go upstream and is offered there, but no PR
  # exists yet, so `upstream_pr` stays empty and the drop heuristics cannot fire.
  - name: hyperv-migration-source
    branch: feat/hyperv-migration-source
    base: main
    kind: feature
    upstream_pr:
    summary: 'Hyper-V as a migration source: connect, inspect, preflight and import VMs into Proxmox'
    commit_message: 'feat(hyperv): add Hyper-V as a migration source'
    requested_by: 15

  # PVE keeps no author for a snapshot -- the call arrives as the cluster's root
  # ticket -- so the fork records who asked for one, in a table of its own, and
  # binds each record to the snapshot's snaptime so a reused name cannot inherit
  # it. Shown together with the description PVE does store, under one set of
  # display rules, in the VM views and the cluster-wide overview. The efficient
  # snapshots' existing `created_by` column was always written empty and now
  # carries the acting account. Ordered last of the three that touch the
  # Corporate VM detail in web/src/vm_modals.js: it rewrites the snapshot rows
  # that vm-description-summary and snapshot-error-toasts leave alone. A
  # system-wide overview is deliberately out of scope (issue #39).
  - name: snapshot-author-metadata
    branch: feat/snapshot-author-metadata
    base: main
    kind: feature
    upstream_pr:
    summary: 'Snapshots say who created them, next to the description, in the VM and cluster views'
    commit_message: 'feat(snapshots): show who created a snapshot'
    requested_by: 39

# Files whose conflicts are resolved by regenerating them instead of merging.
# web/index.html is a build artefact (web/Dev/build.sh compiles it from
# web/index.html.original + web/src/*.js) and conflicts on every backport
# because upstream ships a bundle built from a different tree.
generated_files:
  - path: web/index.html
    rebuild: web/Dev/build.sh

# Gate for publishing: all of these must pass before a tag is pushed.
verify:
  pytest: true
