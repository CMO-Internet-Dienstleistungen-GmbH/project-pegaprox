# Which upstream release we track, and which of our fixes ride on top of it.
#
# This file is the only thing that changes when a fix lands upstream or a new
# one is added — the scripts read it, nothing is hardcoded there.

upstream:
  # GitHub repo we track. Releases (not arbitrary tags) drive the sync.
  repo: PegaProx/project-pegaprox
  url: https://github.com/PegaProx/project-pegaprox.git

fork:
  # Remote name inside the clone the scripts run in.
  remote: origin
  # Rebuilt from the upstream release tag on every sync — never merged into,
  # so it is force-pushed by design. The tags below are the stable references.
  integration_branch: cmo/main
  # Tag scheme: <upstream tag>-<suffix>.<n>, e.g. v1.0.2-cmo.1
  tag_suffix: cmo

# Our patches, applied in this order on top of the upstream release tag.
#
#   branch       a branch in the fork holding the commits
#   base         the upstream branch that branch was built on; the commits taken
#                are `merge-base(base, branch)..branch`
#   upstream_pr  the pull request upstream; when it is merged, the patch is
#                dropped from the set instead of applied (the fix is in the
#                release by then). Leave empty if there is no PR yet.
#   kind         fix | feature | internal, default fix.
#                `fix` and `feature` are meant to end up upstream and disappear
#                from this file on their own -- the sync drops them once the
#                release contains the work (patch-id) or the PR is merged.
#                `internal` is the opposite promise: it stays in the fork for
#                good, so neither heuristic is allowed to touch it and an empty
#                commit set is an error rather than a silent skip.
#                An unknown value stops the run: a typo must not quietly turn a
#                permanent patch back into a droppable one.
#   requested_by an issue number in **this** fork, and required for every patch.
#                That issue is the patch's scope: what it does, what it
#                deliberately does not do, and acceptance criteria that can be
#                checked. It is what a conflict is resolved against -- without
#                it, whoever carries the patch across a moved codebase is
#                guessing at what to preserve. Closed is fine; the work being
#                done does not make the scope less true.
patches:
  # Upstream issue #743 is open; PR #745 was closed pending discussion, so there
  # is no PR to track and the entry has to be retired by hand once upstream
  # ships its own System theme.
  - name: system-theme
    branch: feat/system-theme
    base: main
    kind: feature
    upstream_pr:
    summary: '"System" theme follows the OS light/dark setting (upstream issue #743)'
    requested_by: 6

  # The chooser GitHub shows when someone opens an issue here. Upstream's asks
  # for sponsors and stars; ours asks the two questions the triage needs
  # answered. It is `internal` on purpose -- there is no version of this that
  # upstream would want, so the sync must never decide it has been absorbed.
  - name: issue-templates
    branch: chore/issue-templates
    base: main
    kind: internal
    upstream_pr:
    summary: German issue forms that ask what this fork needs, not what upstream needs
    requested_by: 8

  # Idle keep-alive sockets and run_concurrent stragglers filled the request
  # pool until the server stopped accepting; see the commit for the analysis.
  - name: request-pool-starvation
    branch: fix/request-pool-starvation
    base: main
    kind: fix
    upstream_pr:
    summary: 'Idle keep-alive connections and run_concurrent stragglers no longer starve the request pool'
    requested_by: 7

  # One idle tab produced ~4 REST calls/s: authFetch was rebuilt on every render,
  # so the seven ui.js components that depend on it had their polling effects
  # re-armed by every SSE frame; and the guest-info cache treated a "no address"
  # answer as a cache miss, which closed into a self-feeding loop.
  # Upstream issue #782 carries the measurements. No PR yet, so `upstream_pr`
  # stays empty and the patch-id heuristic is the only drop check for now.
  - name: ui-request-amplification
    branch: fix/ui-request-amplification
    base: main
    kind: fix
    upstream_pr:
    summary: 'The UI stops re-arming its polling effects on every render, and the guest-info fan-out stops feeding itself'
    requested_by: 10

# Files whose conflicts are resolved by regenerating them instead of merging.
# web/index.html is a build artefact (web/Dev/build.sh compiles it from
# web/index.html.original + web/src/*.js) and conflicts on every backport
# because upstream ships a bundle built from a different tree.
generated_files:
  - path: web/index.html
    rebuild: web/Dev/build.sh

# Gate for publishing: all of these must pass before a tag is pushed.
verify:
  pytest: true
